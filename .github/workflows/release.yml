name: Build and publish plugin

on:
  push:
    branches:
      - main
      - fix/self-contained-release-workflow
      - fix/config-bootstrap
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PLUGIN_NAME: silo-plugin-livetv
  MANIFEST_PATH: cmd/silo-plugin-livetv/manifest.json
  IMAGE_NAME: ghcr.io/tw1zt3d2four7/silo-plugin-livetv

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build embedded frontend before Go tests
        run: make web

      - name: Test Go and web code
        run: make test

      - name: Build Linux amd64 plugin
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          make build
          file "$PLUGIN_NAME"
          sha256sum "$PLUGIN_NAME" | awk '{print $1}' > "$PLUGIN_NAME.sha256"
          cp "$PLUGIN_NAME" plugin-linux-amd64
          sha256sum plugin-linux-amd64 > checksums.txt

      - name: Prepare release package
        run: |
          checksum="$(sha256sum "$PLUGIN_NAME" | awk '{print $1}')"
          jq --arg checksum "$checksum" '.checksum = $checksum' "$MANIFEST_PATH" > manifest.json
          tar -czf "$PLUGIN_NAME-linux-amd64.tar.gz" "$PLUGIN_NAME" manifest.json "$PLUGIN_NAME.sha256"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish package image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/package.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Tw1zT3d2four7/silo-plugin-livetv
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugin-latest
          name: Latest plugin build
          body: Automated Linux amd64 plugin build for the current main branch.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            ${{ env.PLUGIN_NAME }}
            ${{ env.PLUGIN_NAME }}.sha256
            ${{ env.PLUGIN_NAME }}-linux-amd64.tar.gz
            plugin-linux-amd64
            checksums.txt
            manifest.json

      - name: Notify Silo plugin catalog
        if: github.ref == 'refs/heads/main'
        env:
          CATALOG_DISPATCH_TOKEN: ${{ secrets.CATALOG_DISPATCH_TOKEN }}
        run: |
          if [ -z "$CATALOG_DISPATCH_TOKEN" ]; then
            echo "::warning::CATALOG_DISPATCH_TOKEN is not configured; catalog auto-update was skipped."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $CATALOG_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Tw1zT3d2four7/silo-plugins/dispatches \
            -d '{"event_type":"plugin_release_published","client_payload":{"repo":"Tw1zT3d2four7/silo-plugin-livetv","tag":"plugin-latest"}}'
